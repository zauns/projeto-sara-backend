services:
  database:
    image: mysql:8.0
    container_name: sara-emprega-db
    restart: unless-stopped
    env_file: ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    networks:
      - app-network
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./saraEmprega
      dockerfile: sara_backend.dockerfile
    container_name: sara-emprega-backend
    restart: unless-stopped
    env_file: ./.env
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      database:
          condition: service_healthy
  frontend:
    build:
      context: ./projeto-sara-frontend
      dockerfile: sara_frontend.dockerfile
    container_name: sara-emprega-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
    driver: local
