services:
  database:
    image: mysql:8.0
    container_name: sara-emprega-db
    restart: unless-stopped
    env_file: ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    command:
      - --bind-address=0.0.0.0
      - --performance-schema=OFF
      - --default-authentication-plugin=mysql_native_password
    networks:
      - app-network
    volumes:
      - db-data:/var/lib/mysql
      - ./mysql-custom.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      timeout: 10s
      retries: 3
      start_period: 30s
      interval: 10s

  backend:
    build:
      context: ./saraEmprega
      dockerfile: sara_backend.dockerfile
    container_name: sara-emprega-backend
    restart: unless-stopped
    env_file: ./.env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_PUBLIC_KEY_CONTENT: ${JWT_PUBLIC_KEY_CONTENT}
      JWT_PRIVATE_KEY_CONTENT: ${JWT_PRIVATE_KEY_CONTENT}
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
    ports:
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      timeout: 20s
      retries: 3
      start_period: 60s
      interval: 15s
    volumes:
      - maven-cache:/root/.m2

  frontend:
    build:
      context: ./projeto-sara-frontend
      dockerfile: sara_frontend.dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
    container_name: sara-emprega-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - backend
    volumes:
      - npm-cache:/home/node/.npm

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  maven-cache:
    driver: local
  npm-cache:
    driver: local
