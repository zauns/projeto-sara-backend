# --- Configuração do Servidor ---
server:
  port: ${SERVER_PORT}

spring:
  application:
    name: sara-emprega

  util:
    encoderStrength: 4

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      continue-on-error: true

  cloud:
    consul:
        enabled: false

    service-registry:
      auto-registration:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  public-key: ${JWT_PUBLIC_KEY_CONTENT}
  private-key: ${JWT_PRIVATE_KEY_CONTENT}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.jdbc.datasource: DEBUG
