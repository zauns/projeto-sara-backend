server:
  port: 8080

spring:
  util:
    encoderStrength: 4

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 123

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create   # cria as tabelas a cada inicialização
    show-sql: true
    defer-datasource-initialization: true  # garante que o Hibernate cria antes do data.sql

  sql:
    init:
      mode: always        # executa SEMPRE o data.sql
      continue-on-error: true  # ignora pequenos erros caso algo já exista

  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  public-key: classpath:jwtKeys/public_key.pem
  private-key: classpath:jwtKeys/private_key.pem
