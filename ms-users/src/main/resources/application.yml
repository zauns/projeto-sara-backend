server:
  port: 8080

spring:
  util:
    encoderStrength: 4
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 123

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update  # opções: none | validate | update | create | create-drop
    show-sql: true       # exibe as queries SQL no console

  h2:
    console:
      enabled: true
      path: /h2-console


jwt:
  public-key: classpath:jwtKeys/public_key.pem
  private-key: classpath:jwtKeys/private_key.pem

